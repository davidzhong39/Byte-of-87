<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Habitat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="background"></div>

        <div class="floor-panel">
            <div class="seam seam1"></div>
            <div class="seam seam2"></div>
            <div class="seam seam3"></div>
            <div class="seam seam4"></div>
            <div class="seam seam5"></div>
        </div>

        <div class="control-panel">
            <div class="panel-top"></div>
            <div class="panel-front"></div>
        </div>

        <div class="wall wall-left">
            <button class="left-control-panel" id="left-control-panel" type="button"></button>
        </div>
        <div class="wall wall-right"></div>

        <div class="wall-front">
            <div class="window-frame">
                <div class="window-glass"></div>
            </div>
        </div>

        <div id="panel-popup" class="panel-popup">
            <h2>Control Panel</h2>
            <p>Panel contents go here.</p>
        </div>
    </div>
    
</body>
</html>
