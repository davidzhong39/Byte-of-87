<!DOCTYPE html>
<html>
<head>
  <title>Aria-9 Station Monitor</title>
  <style>
    body { background: #0b0e14; color: #00ffcc; font-family: monospace; padding: 20px; }
    .metric { border: 1px solid #00ffcc; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>ARIA-9 HABITAT STATUS</h1>
  <div class="metric">Oxygen: <span id="o2">100</span>%</div>
  <div class="metric">Power: <span id="power">100</span>%</div>
  <button id="minigame-btn">Fix System (Griffin Minigame)</button>

  <script src="app.js"></script>
</body>
</html>
